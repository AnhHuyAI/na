{% extends "base.html" %}

{% block title %}Tạo mã giảm giá - Admin{% endblock %}

{% block content %}
<h1 class="mb-4">Tạo mã giảm giá</h1>

<form method="POST">
    <div class="mb-3">
        <label for="code" class="form-label">Mã giảm giá</label>
        <input type="text" class="form-control" id="code" name="code" required>
    </div>

    <div class="mb-3">
        <label for="discount_type" class="form-label">Loại</label>
        <select class="form-select" id="discount_type" name="discount_type" required>
            <option value="fixed">Fixed (Cố định)</option>
            <option value="percentage">Percentage (%)</option>
        </select>
    </div>

    <div class="mb-3">
        <label for="value" class="form-label">Giá trị</label>
        <input type="number" class="form-control" id="value" name="value" required>
    </div>

    <div class="mb-3">
        <label for="max_discount" class="form-label">Giảm tối đa (cho percentage)</label>
        <input type="number" class="form-control" id="max_discount" name="max_discount">
    </div>

    <div class="mb-3">
        <label for="min_order_value" class="form-label">Đơn tối thiểu</label>
        <input type="number" class="form-control" id="min_order_value" name="min_order_value" value="0">
    </div>

    <div class="mb-3">
        <label for="usage_limit" class="form-label">Giới hạn lượt dùng</label>
        <input type="number" class="form-control" id="usage_limit" name="usage_limit">
        <small class="text-muted">Để trống = không giới hạn</small>
    </div>

    <div class="row">
        <div class="col-md-6 mb-3">
            <label for="valid_from" class="form-label">Có hiệu lực từ</label>
            <input type="datetime-local" class="form-control" id="valid_from" name="valid_from" required>
        </div>
        <div class="col-md-6 mb-3">
            <label for="valid_until" class="form-label">Đến</label>
            <input type="datetime-local" class="form-control" id="valid_until" name="valid_until" required>
        </div>
    </div>

    <div class="mb-3">
        <label for="description" class="form-label">Mô tả</label>
        <textarea class="form-control" id="description" name="description" rows="2"></textarea>
    </div>

    <button type="submit" class="btn btn-primary">Tạo mã</button>
    <a href="{{ url_for('admin.discounts') }}" class="btn btn-secondary">Hủy</a>
</form>
{% endblock %}
